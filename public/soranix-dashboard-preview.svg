<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Soranix</title><desc id="desc">Soranix anime platform, featuring the atom logo from the dashboard.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%"><stop stop-color="#21103d"/><stop offset="1" stop-color="#05030b"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5815b8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="270" r="225" fill="#8500ff" opacity=".12"/>
  <rect x="460" y="90" width="280" height="280" rx="62" fill="url(#tile)"/>
  <g fill="none" stroke="#e9d5ff" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="600" cy="230" rx="90" ry="36"/>
    <ellipse cx="600" cy="230" rx="90" ry="36" transform="rotate(60 600 230)"/>
    <ellipse cx="600" cy="230" rx="90" ry="36" transform="rotate(120 600 230)"/>
  </g>
  <circle cx="600" cy="230" r="11" fill="#fff"/>
  <text x="600" y="455" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" letter-spacing="8">SORANIX</text>
  <text x="600" y="510" text-anchor="middle" fill="#c5b6e8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="5">THE ULTIMATE GALAXY OF ANIME</text>
</svg>